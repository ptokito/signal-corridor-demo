# NGINX reverse proxy in front of the Operations Portal.
#
# - Public traffic on port 80 is passed to gunicorn on 127.0.0.1:8000.
# - X-Request-Start lets the New Relic Python agent measure "request queueing":
#   time a request waited in NGINX before the app picked it up.
# - /nginx_status exposes NGINX's built-in stub_status counters for the New Relic
#   NGINX integration. Only reachable from the machine itself.
# - The custom log format adds request time, so slow requests show in the logs.

log_format corridor '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time ua="$http_user_agent"';

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/corridor_access.log corridor;
    error_log  /var/log/nginx/corridor_error.log warn;

    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Start "t=${msec}";
        proxy_read_timeout 30s;
    }
}
